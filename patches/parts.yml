Change:
  BasePart:
    # BasePart.BrickColor now defers to the Color3 properties in every case, so
    # we can basically pretend that BrickColor and brickColor never existed.
    brickColor:
      Serialization:
        Type: Migrate
        To: Color
        Migration: BrickColorToColor
    BrickColor:
      Serialization:
        Type: Migrate
        To: Color
        Migration: BrickColorToColor
    Color:
      Serialization:
        Type: SerializesAs
        As: Color3uint8
    Color3uint8:
      AliasFor: "Color"

    Size:
      Serialization:
        Type: SerializesAs
        As: size
    size:
      AliasFor: Size

    MaterialVariant:
      Serialization:
        Type: SerializesAs
        As: MaterialVariantSerialized
    MaterialVariantSerialized:
      AliasFor: MaterialVariant

  FormFactorPart:
    FormFactor:
      Serialization:
        Type: SerializesAs
        As: formFactorRaw
    formFactor:
      AliasFor: FormFactor
    formFactorRaw:
      AliasFor: FormFactor

  Part:
    Shape:
      Serialization:
        Type: SerializesAs
        As: shape
    shape:
      AliasFor: Shape

  MeshPart:
    MeshId:
      Serialization:
        Type: Migrate
        To: MeshContent
        Migration: ContentIdToContent
    TextureID:
      Serialization:
        Type: Migrate
        To: TextureContent
        Migration: ContentIdToContent

  # CollisionFidelity is empirically serialized by Roblox Studio's Save-As
  # (verified 2026-05-26 against a production game: all 22 MeshParts of
  # a fuselage Model preserve `PreciseConvexDecomposition` through Save-As
  # → load round-trip). The upstream API dump marks it `DoesNotSerialize`,
  # which causes rbx-dom-based readers to silently drop the property —
  # leaving freshly-created MeshParts at the engine default `Box`, which
  # catastrophically breaks raycasts on non-cuboid meshes (ProximityPrompt
  # line-of-sight, mouse-hover detection, projectile physics, etc).
  # Property is defined on TriangleMeshPart (MeshPart's superclass),
  # not MeshPart directly.
  TriangleMeshPart:
    CollisionFidelity:
      Serialization:
        Type: Serializes
